services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # ⚠️ BUILD-TIME ENV VARS: Set during "docker compose build"
      # These are embedded into the Next.js bundle at build time
      args:
        - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-}
        - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-KSS_Client_Web}
    ports:
      - "3000:3000"
    # ⚠️ RUNTIME ENV VARS: Set during "docker compose up"
    # These are available when the container is running
    environment:
      # Required Environment Variables
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      
      # Optional: Google OAuth (only if using Google login)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      
      # Optional: SMTP Email (only if sending emails)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      
      # Optional: Cloudflare Turnstile (only if using CAPTCHA)
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

